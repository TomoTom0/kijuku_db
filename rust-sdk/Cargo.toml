[package]
name = "kijuku-db"
version = "0.1.0"
edition = "2021"
authors = ["Kijuku DB Team"]
description = "きじゅくDB - Rust SDK for media database management"
license = "MIT"
repository = "https://github.com/TomoTom0/kijuku_db"
keywords = ["database", "media", "sqlite", "sdk"]
categories = ["database"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "kijuku-cli"
path = "src/bin/cli.rs"
