[package]
name = "kijuku-db"
version = "0.1.0"
edition = "2021"
authors = ["Kijuku DB Team"]
description = "きじゅくDB - Rust SDK for media database management"
license = "MIT"
repository = "https://github.com/TomoTom0/kijuku_db"
keywords = ["database", "media", "sqlite", "sdk"]
categories = ["database"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "chrono", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
axum-extra = { version = "0.10", features = ["cookie"] }
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
include_dir = "0.7"
ssh2 = "0.9"

[dev-dependencies]
tempfile = "3.0"

[lib]
name = "kijuku_db"
path = "src/lib.rs"

[[bin]]
name = "kijuku-cli"
path = "src/bin/cli.rs"
